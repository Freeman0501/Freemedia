<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠：瑪爾濟斯大挑戰</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="style.css">
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-decorations">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <!-- 頂部功能區 (懸浮按鈕) -->
    <div class="top-controls">
        <button id="audioToggle" class="icon-btn" title="切換音效">🔊</button>
        <button id="fullscreenToggle" class="icon-btn" title="切換全螢幕">⤢</button>
    </div>

    <div class="game-container">
        <!-- 頂部資訊列 (毛玻璃效果) -->
        <header class="glass-panel">
            <h1 class="game-title">
                <img src="assets/maltese.png" alt="瑪爾濟斯logo" class="title-logo">
                瑪爾濟斯大挑戰
            </h1>
            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-label">關卡</span>
                    <span class="stat-value" id="level">1</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">分數</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">時間</span>
                    <span class="stat-value" id="time">30</span>
                </div>
            </div>
            <div class="controls">
                <button id="startBtn" class="btn primary-btn">開始遊戲</button>
            </div>
        </header>

        <!-- 遊戲主要區域: 地洞網格 -->
        <main class="grid-container">
            <!-- 9 個地洞 -->
            <div class="hole hole1">
                <div class="maltese"></div>
            </div>
            <div class="hole hole2">
                <div class="maltese"></div>
            </div>
            <div class="hole hole3">
                <div class="maltese"></div>
            </div>
            <div class="hole hole4">
                <div class="maltese"></div>
            </div>
            <div class="hole hole5">
                <div class="maltese"></div>
            </div>
            <div class="hole hole6">
                <div class="maltese"></div>
            </div>
            <div class="hole hole7">
                <div class="maltese"></div>
            </div>
            <div class="hole hole8">
                <div class="maltese"></div>
            </div>
            <div class="hole hole9">
                <div class="maltese"></div>
            </div>
        </main>

        <!-- 訊息疊加層 (過關/結束) -->
        <div id="overlay" class="overlay hidden">
            <div class="overlay-content glass-panel">
                <h2 id="overlayTitle">準備好囉！</h2>
                <p id="overlayMessage">點擊「開始遊戲」挑戰 10 個難度！</p>
                <div class="overlay-buttons">
                    <button id="nextLevelBtn" class="btn success-btn hidden">進入下一關</button>
                    <button id="restartBtn" class="btn primary-btn hidden">重新開始</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        Designed with ❤️ for Freeman
    </footer>

    <script src="game.js"></script>
</body>
</html>
