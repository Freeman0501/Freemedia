<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑪爾濟斯大戰貓咪</title>
    <link rel="icon" href="logo.png" type="image/png">
    <meta name="description" content="精緻質感的太空射擊遊戲。">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="hud">
        <div class="hud-item">
            <span class="label">分數</span>
            <span class="value" id="score">0</span>
        </div>
        <div class="hud-item center">
            <span class="title"
                style="color: transparent; -webkit-text-stroke: 1.5px #00ff00; text-shadow: 0 0 8px #00ff00, 0 0 20px #00ff00;">Amber
                VS Cats</span>
        </div>
        <div class="hud-item right" style="flex-direction: row; justify-content: flex-end; align-items: center; gap: 20px;">
            <div style="display: flex; flex-direction: column; align-items: flex-end;">
                <span class="label">關卡</span>
                <span class="value" id="level">1</span>
            </div>
            <button id="mute-btn" class="cyber-btn" title="切換靜音" style="padding: 0; margin: 0; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; width: 50px; height: 50px; border-radius: 50%;">🔊</button>
        </div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="1000" height="700"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="panel">
                <h1>Amber城主</h1>
                <p>趕走貓咪吧！</p>
                <div class="controls">
                    <p><span>◀ ▶ / A D</span> 移動</p>
                    <p><span>空白鍵 (SPACE)</span>發射飛彈</p>
                </div>
                <button id="start-btn" class="cyber-btn">開始遊戲</button>
            </div>

            <div id="game-over-screen" class="panel hidden">
                <h1 class="danger">任務失敗</h1>
                <div class="stats">
                    <p>最終分數: <span id="final-score">0</span></p>
                    <p>勝利次數: <span id="final-level">1</span></p>
                </div>
                <button id="restart-btn" class="cyber-btn">重新挑戰</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
