<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經典打磚塊 | Classic Breakout</title>
    <link rel="stylesheet" href="style.css">
    <!-- Inline Logo for fallback -->
    <link rel="icon" href="logo.jpg">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo-wrapper">
                <div class="css-logo" id="logo">
                    <span class="logo-paddle"></span>
                    <span class="logo-ball"></span>
                </div>
                <h1>經典打磚塊</h1>
            </div>
            <div class="controls">
                <button id="mute-btn" class="glass-btn" title="切換靜音">
                    <span class="icon">🔊</span>
                </button>
            </div>
        </header>

        <main>
            <div class="game-wrapper">
                <canvas id="gameCanvas"></canvas>
                <div id="overlay" class="overlay">
                    <div class="message-box">
                        <h2 id="status-text">準備好了嗎？</h2>
                        <button id="start-btn" class="glow-btn">開始遊戲</button>
                    </div>
                </div>
            </div>
            
            <div class="help-section">
                <div class="help-item"><span>↔️</span> 滑鼠 / 左右方向鍵：移動</div>
                <div class="help-item"><span>🚀</span> 空白鍵：發射雷射 (取得 L 時)</div>
                <div class="help-item"><span>🅿️</span> 點擊按鈕：切換靜音</div>
            </div>
        </main>

        <footer>
            <div class="stats">
                <div class="stat-item">關卡: <span id="level">1</span></div>
                <div class="stat-item">分數: <span id="score">0</span></div>
                <div class="stat-item">最高分: <span id="high-score">0</span></div>
                <div class="stat-item">生命: <span id="lives">3</span></div>
            </div>
            <div class="signature">Designed for Freeman</div>
        </footer>
    </div>
    <script src="game.js"></script>
</body>
</html>
