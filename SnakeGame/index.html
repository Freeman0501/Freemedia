<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貪吃蛇 | Premium Web Edition</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <meta name="description" content="A beautifully designed modern snake game.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>貪吃蛇 <span class="highlight">Snake</span></h1>
            <div class="score-board">
                <div class="score-box">
                    <span class="score-label">SCORE</span>
                    <span id="score">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">HIGH SCORE</span>
                    <span id="high-score">0</span>
                </div>
                <button id="mute-btn" class="btn" style="padding: 5px; margin-left: 10px; min-width: 32px; height: 32px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center;" title="切換靜音">🔊</button>
            </div>
        </header>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
            
            <div id="game-overlay" class="overlay hidden">
                <h2 id="overlay-title">Game Over</h2>
                <div id="score-display">
                    <p>Final Score: <span id="final-score">0</span></p>
                </div>
                <button id="restart-btn" class="btn">Play Again</button>
            </div>
        </div>

        <div class="controls-hint">
            <p>使用 <strong>方向鍵</strong> 或 <strong>WASD</strong> 控制移動，按 <strong>空白鍵</strong> 暫停遊戲。</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
