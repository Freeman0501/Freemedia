<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U 與 TXT 互轉工具 | 質感網頁工具</title>
    <link rel="icon" href="logo.png" type="image/png">
    <!-- Use vanilla CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="background-animation"></div>
    <div class="container">
        <header>
            <h1>
                <img src="logo.png" alt="Logo"
                    style="height: 1.2em; vertical-align: middle; margin-right: 10px; border-radius: 12px;">
                M3U
                <i class="fas fa-right-left mx-2 text-muted" style="font-size: 0.6em;"></i>
                TXT
                <span style="color: #10b981; font-weight: 700;">&nbsp;轉換器</span>
            </h1>
            <p>簡單快速地在不同 IPTV 播放清單格式之間切換，並輕鬆複製或下載。</p>
        </header>

        <main>
            <div class="panel input-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-keyboard"></i> 輸入內容</h2>
                    <div class="actions">
                        <button id="clearBtn" class="btn btn-icon" title="清空所有內容"><i
                                class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
                <textarea id="inputText" placeholder="請在此貼上您的 M3U 或 TXT 格式內容...

範例 (M3U):
#EXTM3U
#EXTINF:-1 group-title=&#34;新聞台&#34;,新聞1台
http://example.com/stream1.m3u8

範例 (TXT):
新聞台,#genre#
新聞1台,http://example.com/stream1.m3u8" spellcheck="false"></textarea>
                <div class="controls">
                    <button id="m3uToTxtBtn" class="btn btn-primary"><i class="fas fa-file-alt"></i> 轉為 TXT</button>
                    <button id="txtToM3uBtn" class="btn btn-secondary"><i class="fas fa-file-audio"></i> 轉為 M3U</button>
                </div>
            </div>

            <div class="panel output-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-check-circle"></i> 轉換結果</h2>
                    <div class="actions">
                        <span id="statusMsg" class="status-msg"></span>
                        <button id="copyBtn" class="btn btn-icon" title="複製結果"><i class="fas fa-copy"></i></button>
                        <button id="downloadBtn" class="btn btn-icon" title="下載檔案"><i
                                class="fas fa-download"></i></button>
                    </div>
                </div>
                <textarea id="outputText" readonly placeholder="轉換後的結果將會顯示於此..." spellcheck="false"></textarea>
            </div>
        </main>

        <footer>
            <p>Designed with <i class="fas fa-heart text-secondary"></i> for Freeman</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
